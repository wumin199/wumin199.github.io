### 三者的联动关系：一个完整的认知反馈环

| 阶段 | 状态 | 产出 | 工具联动 |
| :--- | :--- | :--- | :--- |
| **逻辑引导** | 模糊但有方向 | **解题策略** | **Gemini** 告诉你：“用分块矩阵求逆的思路去做。” |
| **符号演算** | 精确但抽象 | **解析公式** | **Wolfram/SymPy** 帮你算出：“公式的右边应该是 $A^{-1}-A^{-1}U...$。” |
| **数值实证** | 具体且可感 | **运行结果/误差图** | **Code Assist** 帮你写出验证代码，发现误差在 $10^{-15}$，证明公式无误。 |

